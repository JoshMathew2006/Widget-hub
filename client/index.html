<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <style>

        @font-face {
            font-family: 'Andromeda';
            src: url('fonts/Andromeda-eR2n.ttf') format('truetype');
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        .chat-scrollable::-webkit-scrollbar {
            width: 10px;
        }
        .chat-scrollable::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scrollable::-webkit-scrollbar-thumb {
            background: #00E5FF;
            border-radius: 10px;
            border: 3px solid transparent;
            background-clip: padding-box;
        }

    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <button id="settingsToggle" style="
        position:fixed; 
        top:20px; 
        left:20px; 
        z-index:10;
        background: transparent;
        border: none;
        color: #00E5FF;
        font-size: 38px;
        font-family: sans-serif;
        cursor: pointer;
        text-shadow: 0 0 10px #00E5FF, 0 0 20px #00E5FF;
    ">⚙</button>

    <div id="settingsPanel" style="
        display:none; 
        position:fixed; 
        top:70px; 
        left:10px; 
        background: rgba(0, 10, 15, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid #00E5FF33;
        box-shadow: 0 0 12px #00E5FF44;
        padding: 16px; 
        border-radius: 10px; 
        z-index:10;
        width: 140px;
        display: flex;
        flex-direction: column;
        align-items: center;
    ">
        <p style="color:white; margin: 4px 0; font-size: 20px; font-family:'Andromeda', sans-serif; letter-spacing: 1px; text-transform: uppercase;">Background</p>
        <div id="bgColorPicker" style="margin-bottom: 16px;"></div>

        <p style="color:white; margin: 4px 0; font-size: 20px; font-family:'Andromeda', sans-serif; letter-spacing: 1px; text-transform: uppercase;">Widgets</p>
        <div id="bodyColorPicker" style="margin-bottom: 16px;"></div>

        <p style="color:white; margin: 4px 0; font-size: 20px; font-family:'Andromeda', sans-serif; letter-spacing: 1px; text-transform: uppercase;">Buttons</p>
        <div id="buttonColorPicker" style="margin-bottom: 16px;"></div>
    </div>

    <div id="widgetPicker" style="
        display:none; 
        position:fixed; 
        top:70px; 
        right:10px; 
        background: rgba(0, 10, 15, 0.35);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid #00E5FF33;
        box-shadow: 0 0 12px #00E5FF44;
        padding: 12px; 
        border-radius: 10px; 
        z-index:10;
        display: flex;
        flex-direction: column;
        gap: 8px;
    ">
        <button class="widget-option" data-type="box" style="background: transparent; border: 1px solid #00E5FF; color: #00E5FF; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-shadow: 0 0 6px #00E5FF; font-family: 'Andromeda', sans-serif; font-size: 20px;">Box</button>
        <button class="widget-option" data-type="note" style="background: transparent; border: 1px solid #00E5FF; color: #00E5FF; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-shadow: 0 0 6px #00E5FF; font-family: 'Andromeda', sans-serif; font-size: 20px;">Note</button>
        <button class="widget-option" data-type="chat" style="background: transparent; border: 1px solid #00E5FF; color: #00E5FF; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-shadow: 0 0 6px #00E5FF; font-family: 'Andromeda', sans-serif; font-size: 20px;">Chat</button>
    
    </div>

    <div id="noteContainer" style="position: absolute; top: 0; left: 0; pointer-events: none;">

    </div>

    <div id = "gestureCursorEl" style = "
        position: fixed;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid #00E5FF;
        pointer-events: none;
        z-index: 9999;
        display: none;
    ">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script type = "module" src="client.js"></script>
</body>
</html>
